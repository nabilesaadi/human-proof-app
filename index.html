<script>
        const SUPABASE_URL = "https://jxpuzqmfttjuxhibkgig.supabase.co";
        const SUPABASE_KEY = "sb_publishable_LqTsant7xUHzUx6Cm3a6Pw_rbGXOGUM";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function processCertification() {
            const content = document.getElementById('textContent').value;
            const btn = document.getElementById('btnAction');
            if (!content || content.length < 20) { alert("Texte trop court"); return; }
            btn.innerText = "Traitement...";
            btn.disabled = true;

            const encoder = new TextEncoder();
            const data = encoder.encode(content);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            const { data: res, error } = await db.from('certifications').insert([{ 
                content_hash: hashHex, 
                content_preview: content.substring(0, 50),
                status: 'certified'
            }]).select();

            if (error) {
                alert("Erreur : " + error.message);
                btn.disabled = false;
                btn.innerText = "Certifier ce texte";
            } else {
                document.getElementById('resultSection').classList.remove('hidden');
                document.getElementById('certId').innerText = res[0].id;
                btn.innerText = "Certifié ! ✅";
            }
        }
    </script>
